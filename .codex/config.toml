# praxis:begin safe-permissions sha256=c6a9578e3be33d291c5c0e6c08f415e4f393903b77654c78b0e4bc80997e605c
default_permissions = "praxis-safe-permissions"

[permissions.praxis-safe-permissions]
description = "Workspace editing with Praxis secret-file protections and no sandbox network access."
extends = ":workspace"

[permissions.praxis-safe-permissions.filesystem]
glob_scan_max_depth = 12

[permissions.praxis-safe-permissions.filesystem.":workspace_roots"]
".env" = "deny"
"**/.env" = "deny"
".env.local" = "deny"
"**/.env.local" = "deny"
".env.*.local" = "deny"
"**/.env.*.local" = "deny"
".env.development" = "deny"
"**/.env.development" = "deny"
".env.production" = "deny"
"**/.env.production" = "deny"
".env.staging" = "deny"
"**/.env.staging" = "deny"
".env.test" = "deny"
"**/.env.test" = "deny"
"*.pem" = "deny"
"**/*.pem" = "deny"
"credentials*" = "deny"
"**/credentials*" = "deny"

[permissions.praxis-safe-permissions.network]
enabled = false
# praxis:end safe-permissions
