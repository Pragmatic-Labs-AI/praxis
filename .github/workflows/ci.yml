name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lets conformance/codex.conformance.test.ts validate emitted Codex
      # rules against the real tool instead of skipping (Tool-neutral rail).
      - run: npm install -g @openai/codex@0.144.6
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run conformance
      # Self-hosting: Praxis's own emitted files must match its methodology source.
      - run: npm run selfcheck
